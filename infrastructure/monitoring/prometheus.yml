global:
  scrape_interval: 15s

scrape_configs:
  - job_name: sanjari-api
    static_configs:
      - targets: ["api:4000"]
    metrics_path: /api/v1/metrics
  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]
