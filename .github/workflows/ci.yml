name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sanjari/api exec prisma validate

  docker-build:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config

  production-approval:
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - run: echo "Production deployment requires protected environment approval."
